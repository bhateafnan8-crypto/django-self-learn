<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 40px;
    }

    .user-list {
        max-width: 500px;
        margin: 0 auto;
        list-style: none;
        padding: 0;
    }

    .user-list li {
        background: #fff;
        border-radius: 8px;
        padding: 15px 20px;
        margin-bottom: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .user-list li span.name {
        font-weight: bold;
        color: #333;
    }

    .paid {
        color: green;
        font-weight: bold;
    }

    .unpaid {
        color: red;
        font-weight: bold;
    }
</style>

<ul class="user-list">
{% for user in users %}
    <li>
        <span class="name">{{ user.name }}</span>
        <span>{{ user.age }} yrs</span>
        <span>{{ user.email }}</span>
        <span class="{% if user.is_paid %}paid{% else %}unpaid{% endif %}">
            {% if user.is_paid %}Paid{% else %}Unpaid{% endif %}
        </span>
    </li>
{% endfor %}
</ul>
