<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% if request.user.is_authenticated %}

    <p>Welcome {{ request.user.username }}</p>

    <a href="{% url 'logout_view' %}">
        Logout
    </a>

{% else %}

    <a href="{% url 'login_view' %}">
        Login
    </a>

{% endif %}

</body>
</html>
