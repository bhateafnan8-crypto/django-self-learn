{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<table>
    <tr>
        <th>Name</th>
        <th>Photo</th>
    </tr>
    {% for std in studs %}
    <tr>
        <td>{{ std.name }}</td>
        <td>
            {% if std.photo %}
                <img src="{{ std.photo.url }}" width="80">
            {% endif %}
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="2">No students found.</td></tr>
    {% endfor %}
</table>
