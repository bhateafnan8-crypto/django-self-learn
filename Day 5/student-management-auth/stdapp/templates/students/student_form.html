{% extends 'base.html' %}
{% block title %}{% if edit %}Edit Student{% else %}Add Student{% endif %}{% endblock %}
{% block content %}
<h2>{% if edit %}Edit Student{% else %}Add Student{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if edit %}Update{% else %}Save{% endif %}</button>
    <a class="btn" style="background:#7f8c8d;" href="{% url 'stdshow' %}">Cancel</a>
</form>
{% endblock %}
