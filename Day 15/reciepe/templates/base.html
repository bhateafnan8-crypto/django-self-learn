<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recipe Book{% endblock %}</title>

    <!-- Bootstrap 5.3.3 (stable) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>

<body class="d-flex flex-column">

    <nav class="navbar bg-body-tertiary border-bottom px-3 py-8">
        <div class="container-fluid">
            
            <div class="d-flex gap-3 align-items-center">
                <a class="navbar-brand fw-bold text-sm" href="{% url 'home' %}">Recipes</a>
                <a href="{% url 'home' %}" class="nav-link">Home</a>
                <a href="{% url 'reciepe_list' %}" class="nav-link">Recipes</a>
            </div>

            <form class="d-flex gap-2" role="search" method="get" action="">
                <input type="search" name="q" placeholder="Search recipe" class="form-control">
                <button type="submit" class="btn btn-outline-info">Search</button>
            </form>
        </div>
    </nav>

    <main class="container-fluid p-3 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS (bundle includes Popper, load only once) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
