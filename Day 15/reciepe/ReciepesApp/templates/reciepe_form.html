{% extends 'base.html' %}

{% block content %}
<p>Reciepe Creation Form:</p>
<form method="post" enctype="multipart/form-data" class="d-flex flex-column justify-content-center w-50 align-items-center">


    {% csrf_token %}


    <label for="exampleFormControlInput" class="form-label mb-2">Reciepe Name:</label>
    <input type="text" class="form-control mb-2" id="exampleFormControlInput" placeholder="Pudding">


    <label for="exampleFormControlInput" class="form-label mb-2">Reciepe Description:</label>
    <textarea type="text" class="form-control mb-2" id="exampleFormControlInput" placeholder="Pudding"></textarea>


    <label for="exampleFormControlInput" class="form-label mb-2">Reciepe Image:</label>
    <input type="image" class="form-control mb-2" id="exampleFormControlInput" placeholder="Select Image">

    <button class="btn btn-success">Create Reciepe</button>
</form>
{% endblock %}
