{% extends 'base.html' %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="col-6 mx-auto card p-3 shadow-lg mt-4">
    {% csrf_token %}
    
    <p class="text-center">Reciepe Updation Form</p>


    <div class="mb-3">
    <label for="exampleFormControlInput" class="form-label mb-2">Reciepe Name:</label>
    <input type="text" name="reciepe_name" value="{{reciepe.reciepe_name}}" class="form-control"  id="exampleFormControlInput" placeholder="Pudding">
    </div>

    <div class="mb-3">

    <label for="exampleFormControlInput" class="form-label mb-2">Reciepe Description:</label>
    <textarea type="text" name="reciepe_description" value="{{reciepe.reciepe_description}}" class="form-control " id="exampleFormControlInput" placeholder="Pudding"></textarea>
    </div>

    <div class="mb-3">

    <label for="exampleFormControlInput" class="form-label mb-2">Reciepe Image:</label>
    <input type="file" name="reciepe_image" value="{{reciepe.reciepe_image}}" class="form-control " id="exampleFormControlInput" placeholder="Select Image">
    </div>

    <button class="btn btn-success" type="submit">Update Reciepe</button>
</form>
{% endblock %}
