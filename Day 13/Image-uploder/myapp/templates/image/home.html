<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

  <title>Image Uploader</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    .app-layout {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .upload-sidebar {
      flex: 0 0 310px;
      height: 100%;
      overflow: hidden;
    }

    .upload-sidebar form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .upload-sidebar #id_photo {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .upload-sidebar #id_photo:focus-visible + .file-picker {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .upload-sidebar .file-picker {
      margin: 0;
      padding: 8px 80px;
      color: #212529;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .upload-sidebar .file-name {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .upload-sidebar .btn {
      margin-top: 4px;
      padding: 8px 88px;

    }

    .gallery-area {
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .gallery-grid .card {
      margin: 0;
      overflow: hidden;
    }

    .gallery-grid img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      object-position: center;
      background-color: #f1f1f1;
    }
  </style>
</head>

<body>
  <div class="app-layout">
    <aside class="upload-sidebar py-5 text-center bg-secondary text-white">
      <h1 class="mb-3">Upload Image</h1>
      <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.photo.errors }}
        {{ form.photo }}
        <label class="file-picker" for="id_photo">Choose File</label>
        <span class="file-name" id="file-name" aria-live="polite">No file chosen</span>
        <input type="submit" class="btn btn-danger" value="Upload">
      </form>
    </aside>

    <main class="gallery-area">
      <div class="gallery-grid">
        {% for x in img %}
        <div class="card">
          <img src="{{ x.photo.url }}" alt="" class="card-img-top">
          <div class="card-footer">
            <small class="text-muted">{{ x.date }}</small>
          </div>
        </div>
        {% endfor %}
      </div>
    </main>
  </div>

    <div class="py-5 text-center bg-secondary text-white">
     <h1 class="mb-3">Upload Image</h1>
     <form action="" method="post" enctype="multipart/form-data">
      {% csrf_token %}

     </form>
    </div>
    <div class="row">
     {% for x in img %}
      <div class="col-sm-4">
       <div class="card m-2">
        <img src="{{x.photo.url}}" alt="" class="card-img-top" height="200px">
        <div class="card-footer">
         <small class="text-muted">{{x.date}}</small>
        </div>
       </div>
      </div>
     {% endfor %}
    </div>
   </div> -->

  <script>
    const photoInput = document.getElementById("id_photo");
    const fileName = document.getElementById("file-name");

    photoInput.addEventListener("change", () => {
      fileName.textContent = photoInput.files.length
        ? photoInput.files[0].name
        : "No file chosen";
    });
  </script>

  <!-- Optional JavaScript; choose one of the two! -->

  <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
    crossorigin="anonymous"></script>
</body>

</html>
