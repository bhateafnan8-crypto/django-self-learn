{% extends "base.html" %}

{% block title %}
Tweet Post
{% endblock %}

{% block content %}
<h1 class="text-center mt-4">Welcome to Tweet Post</h1>

<h2>{% if form.inatnce.pk %} Edit Post {% else %} Create Post {% endif %}</h2>
